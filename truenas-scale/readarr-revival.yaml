apiVersion: v1
kind: ConfigMap
metadata:
  name: readarr-revival-config
  namespace: readarr-revival
data:
  # PostgreSQL Configuration
  postgres-config: |
    POSTGRES_DB=readarr_revival
    POSTGRES_USER=readarr
    POSTGRES_PASSWORD=readarr_password
    POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
  
  # Readarr Configuration
  readarr-config: |
    {
      "metadataProviders": [
        {
          "name": "rreading-glasses",
          "url": "https://api.bookinfo.pro",
          "priority": 1,
          "enabled": true
        },
        {
          "name": "goodreads-scraper",
          "url": "http://localhost:8787",
          "priority": 2,
          "enabled": true
        }
      ],
      "realTimeUpdates": {
        "enabled": true,
        "webhookPort": 8788,
        "publisherIntegration": true,
        "autoRefresh": true
      },
      "communityFeatures": {
        "enabled": true,
        "requireModeration": true,
        "autoApproveTrustedUsers": true,
        "reputationThreshold": 100
      },
      "analytics": {
        "enabled": true,
        "dataRetentionDays": 90,
        "abTesting": true,
        "performanceMonitoring": true
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readarr-revival
  namespace: readarr-revival
  labels:
    app: readarr-revival
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readarr-revival
  template:
    metadata:
      labels:
        app: readarr-revival
    spec:
      containers:
      - name: readarr-revival
        image: readarr-revival:latest
        ports:
        - containerPort: 8787
          name: http
        - containerPort: 8788
          name: webhook
        env:
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "readarr_revival"
        - name: POSTGRES_USER
          value: "readarr"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: readarr-revival-secrets
              key: postgres-password
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: readarr-revival-secrets
              key: redis-password
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: data
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8787
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8787
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: readarr-revival-config
      - name: data
        persistentVolumeClaim:
          claimName: readarr-revival-data
      - name: logs
        persistentVolumeClaim:
          claimName: readarr-revival-logs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: readarr-revival
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "readarr_revival"
        - name: POSTGRES_USER
          value: "readarr"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: readarr-revival-secrets
              key: postgres-password
        - name: POSTGRES_INITDB_ARGS
          value: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: readarr-revival
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: readarr-revival-secrets
              key: redis-password
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "250m"
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: readarr-revival-service
  namespace: readarr-revival
spec:
  selector:
    app: readarr-revival
  ports:
  - name: http
    port: 8787
    targetPort: 8787
  - name: webhook
    port: 8788
    targetPort: 8788
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: readarr-revival
spec:
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: readarr-revival
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readarr-revival-data
  namespace: readarr-revival
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readarr-revival-logs
  namespace: readarr-revival
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: readarr-revival
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: readarr-revival
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: readarr-revival-secrets
  namespace: readarr-revival
type: Opaque
data:
  postgres-password: cmVhZGFycl9wYXNzd29yZA==  # readarr_password (base64)
  redis-password: cmVkaXNfcGFzc3dvcmQ=  # redis_password (base64)
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: readarr-revival-ingress
  namespace: readarr-revival
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: readarr-revival.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: readarr-revival-service
            port:
              number: 8787 